# 1周の区間の並び。上から順に実行する。frames は work/notes.txt のコマ番号の範囲（参考）。ゲーム開始前（1〜2）は含めない。
# kind: replay=人の記録を再生する（route: za/routes/ からの記録、trim: [始め, 終わり]秒。pre（replay の前に流す steps。省略可）→ wait lit のあと範囲を押し、押し終わってから until を待つ。limit は trial5 の実測 + 30 秒）
# snap: true を付けた区間は、押した0.5秒後と2秒ごとのコマを logs/<日時>/frames/ に残す（step_<区間>_<押したもの>・every_<区間>）
# kind: fixed=PCが押す / battle=PCが決まった並びを繰り返す（limit あり） / handoff=人に渡す（全部離して通知し、Enter を待つ。limit は無い）
# steps（上から順に行う。mash と stick は終わりの合図が出るまで続く）:
#   press A（1回押す） / hold PLUS 3s（3秒押して離す） / hold ZL（押したまま次へ） / release ZL（離す） / wait 0.1s（待つ）
#   wait profile（その合図が出るまで待つ。合図名は until と同じ。例: wait profile）
#   mash A（0.5秒ごとに A） / tap stick L up（上に0.2秒倒して離す） / stick L up（上に倒したまま次へ）
#   seq LLALLDDA（1文字1回押す。L=左 R=右 U=上 D=下 A=A） / press ZL+Y（同時に1回押す）
#   ボタン名: A B X Y UP DOWN LEFT RIGHT PLUS ZL ZR L R
# until（終わりの合図。合図が出た時点で次へ）:
#   blackout（画面が暗転。出ていない→出た に変わった時だけ数える。区間の開始時に暗転中なら明るくなるまで待つ）
#   blackout_end（暗転が明けた。blackout と同じく0.5秒以上続いた暗転だけ数える）
#   blackout×N（N回目の暗転） / blackout_end×N（N回目の暗転明け） / skip（ムービーのスキップができた） / talk（会話の枠が出た） / battle（バトルのHPが満タン）
#   face_screen（顔選択の画面が出た） / name_screen（名前入力の画面が出た）
#   done（steps・replay の範囲を押し終わったら次へ） / enter（人の Enter） / end（完了を通知して止まる） / a|b（どちらか先に出た方）
# except: [{when: b_back, press: B}]  区間の中で b_back（「B 戻る」）が出たら B を1回押す。A連打の前に毎回見る。コマ番号は参考。
# limit（秒）: PCが操作する区間の上限。trial5 の実測（区間の先頭から次の区間の先頭まで。切り上げ）+ 30 秒。統合した区間は元の合計 + 30 秒。過ぎたら全部離して人に渡す。
# 区間が終わったら、押している・倒しているものを全部離してから次に進む。handoff は通知するので、notify の印は書かない。
